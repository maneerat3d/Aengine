name: windows-x64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  foundation:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build, and test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" x64 10.0.26100.0 -vcvars_ver=14.44
          cmake --preset windows-x64-debug
          cmake --build --preset windows-x64-debug --parallel
          ctest --preset windows-x64-debug
          cmake --preset windows-x64-release
          cmake --build --preset windows-x64-release --parallel
          ctest --preset windows-x64-release
