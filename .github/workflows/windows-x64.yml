name: windows-x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-x64-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Canonical build and test
        shell: cmd
        run: call build.bat
